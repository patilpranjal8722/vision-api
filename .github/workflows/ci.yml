name: CI

# Quote 'on' to prevent YAML 1.1 parsers from interpreting it as boolean True
'on':
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test & Audit (Python 3.12)
    runs-on: ubuntu-latest

    env:
      # Test-safe environment variables (no external repository secrets required)
      SECRET_KEY: "ci-test-secret-key-at-least-32-chars-long-for-safe-startup"
      DEBUG: "true"
      TESTING: "true"
      DATABASE_URL: "sqlite:///:memory:"
      RATE_LIMIT_ENABLED: "false"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install base and development dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run automated test suite (pytest)
        run: |
          pytest -v

      - name: Run dependency security audit (pip-audit)
        continue-on-error: true
        run: |
          pip-audit
