services:
  # ----------------------------------------------------------------------------
  # API Service (vision-api)
  # ----------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        INSTALL_CV: ${INSTALL_CV:-false}
        INSTALL_POSTGRES: ${INSTALL_POSTGRES:-false}
    container_name: vision-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Database and storage paths inside container override local .env values
      - DATABASE_URL=sqlite:////app/data/vision_api.db
      - UPLOAD_DIR=/app/uploads
    volumes:
      # Persistent named volume for SQLite database file
      - app_data:/app/data
      # Persistent named volume for uploaded image and video files
      - app_uploads:/app/uploads
      # Read-only bind mount for ML weights (partner can drop weights in without rebuilding image)
      - ./models_store:/app/models_store:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request, sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health').getcode() == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ----------------------------------------------------------------------------
  # Optional Database Service (PostgreSQL 16)
  # Activated only when running with: docker compose --profile postgres up
  # ----------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: vision-postgres
    profiles:
      - postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vision_api}
      POSTGRES_USER: ${POSTGRES_USER:-vision_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD environment variable must be set when using the postgres profile}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-vision_user} -d $${POSTGRES_DB:-vision_api}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

# ------------------------------------------------------------------------------
# Persistent Named Volumes
# ------------------------------------------------------------------------------
volumes:
  app_data:
    name: vision_api_data
  app_uploads:
    name: vision_api_uploads
  postgres_data:
    name: vision_api_postgres_data
